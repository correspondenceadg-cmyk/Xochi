name: Release Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/xochi-release.keystore

      - name: Build Signed Release
        run: |
          cd android
          gradle assembleRelease \
            -PKEYSTORE_PATH=xochi-release.keystore \
            -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=xochi \
            -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Verify APK Exists
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "ERROR: APK not found. Here are the build outputs:"
            ls -R android/app/build/outputs/apk/
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
